name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1", "6.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Build (library, snippets, benchmark)
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Benchmark
        run: swift run -c release fuse-benchmark 1000 10000

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
